<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
a{color:#58a6ff;text-decoration:none}
a:hover{text-decoration:underline}

/* Container */
.container{max-width:960px;margin:0 auto;padding:40px 24px 80px}

/* Profile */
.profile{display:flex;align-items:center;gap:24px;margin-bottom:48px;padding-bottom:32px;border-bottom:1px solid #21262d}
.avatar{width:80px;height:80px;border-radius:50%;flex-shrink:0;overflow:hidden;border:2px solid #30363d}
.avatar img{width:100%;height:100%;object-fit:cover}
.info h1{font-size:24px;font-weight:600;margin-bottom:4px;color:#f0f6fc}
.info .bio{font-size:14px;color:#8b949e;margin-bottom:8px}
.info .links{display:flex;gap:16px;font-size:13px;flex-wrap:wrap}
.info .links a{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;color:#8b949e;background:#21262d;border:1px solid #30363d;transition:all .2s}
.info .links a:hover{color:#58a6ff;border-color:#58a6ff;text-decoration:none}

/* Section */
.section-title{font-size:18px;font-weight:600;margin-bottom:20px;color:#f0f6fc;display:flex;align-items:center;gap:8px}
.section-title .count{font-size:13px;font-weight:400;color:#8b949e}

/* Card Grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:768px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}

.card{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden;transition:border-color .2s,transform .2s;display:flex;flex-direction:column}
.card:hover{border-color:#58a6ff;transform:translateY(-2px);text-decoration:none}
.card .cover{width:100%;aspect-ratio:196/92;background:#21262d;background-size:cover;background-position:center;position:relative}
.card .info{padding:12px 14px 14px;flex:1;display:flex;flex-direction:column}
.card .info h3{font-size:14px;font-weight:500;line-height:1.4;color:#f0f6fc;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .info .read-link{font-size:12px;color:#58a6ff;margin-top:auto;display:flex;align-items:center;gap:4px}
.card .info .read-link::after{content:'→';transition:transform .2s}
.card:hover .info .read-link::after{transform:translateX(3px)}

/* Footer */
.footer{margin-top:48px;padding-top:24px;border-top:1px solid #21262d;text-align:center;font-size:13px;color:#484f58}
.footer a{color:#8b949e}

@media(max-width:768px){.profile{flex-direction:column;text-align:center}.info .links{justify-content:center}}
</style>
</head>
